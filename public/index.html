<!doctype html>
<html lang="en" class="dark">

  <head>

    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- TITLE -->
    <title>
      CirclePay – Smart Digital Ajo Savings Platform
    </title>

    <!-- SEO DESCRIPTION -->
    <meta
      name="description"
      content="CirclePay is a secure digital ajo savings and contribution platform that helps users create or join savings groups, contribute money, and receive automated payouts turn-by-turn."
    />

    <!-- SEO KEYWORDS -->
    <meta
      name="keywords"
      content="CirclePay, ajo app, ajo savings, contribution platform, digital ajo, thrift savings, cooperative savings, money contribution app, nigeria ajo platform, group savings"
    />

    <!-- AUTHOR -->
    <meta
      name="author"
      content="CirclePay"
    />

    <!-- THEME COLOR -->
    <meta
      name="theme-color"
      content="#000000"
    />

    <!-- OPEN GRAPH -->
    <meta
      property="og:title"
      content="CirclePay – Digital Ajo Savings Platform"
    />

    <meta
      property="og:description"
      content="Create or join trusted savings groups, contribute securely, and receive automated ajo payouts with CirclePay."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:image"
      content="/assets/images/site-logo.png"
    />

    <!-- TWITTER -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="CirclePay – Smart Digital Ajo Savings"
    />

    <meta
      name="twitter:description"
      content="Nigeria's modern ajo contribution and savings platform with automated payouts."
    />

    <!-- FONTS -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- FAVICON -->
    <link
      rel="icon"
      type="image/png"
      href="/assets/images/site-logo.png"
    />

    <!-- GLOBAL STYLES -->
    <style>

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        padding: 0;

        background:
          radial-gradient(circle at top,
            rgba(255, 215, 0, 0.08),
            transparent 40%),
          #000;

        color: #facc15;

        font-family:
          'Inter',
          'Segoe UI',
          Arial,
          sans-serif;

        overflow-x: hidden;
      }

      #root {
        min-height: 100vh;
      }

      ::selection {
        background: #facc15;
        color: #000;
      }

      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: #111;
      }

      ::-webkit-scrollbar-thumb {
        background: #facc15;
        border-radius: 20px;
      }

      img {
        user-select: none;
      }

    </style>

  </head>

  <body>

    <div id="root"></div>

  </body>

</html>
